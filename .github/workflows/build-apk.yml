name: Build GenieX APK

on:
  workflow_dispatch: # Allows you to manually trigger the build with a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Change Directory and Grant Gradle Permissions
      run: |
        cd geniex_chat_android
        chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: |
        cd geniex_chat_android
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: geniex-chat-app
        path: geniex_chat_android/build/outputs/apk/debug/app-debug.apk
